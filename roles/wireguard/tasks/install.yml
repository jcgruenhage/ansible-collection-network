---

- name: Install wireguard package (Debian/Ubuntu)
  ansible.builtin.apt:
    name: wireguard
    state: present
  when: ansible_facts["distribution"] in ["Debian", "Ubuntu"]

- name: Install wireguard package (Fedora)
  ansible.builtin.dnf:
    name: wireguard-tools
    state: present
  when: ansible_facts["distribution"] == "Fedora"

- name: Install wireguard package (generic)
  ansible.builtin.package:
    name: wireguard-tools
    state: present
  when: ansible_facts["distribution"] not in ["Debian", "Ubuntu", "Fedora"]

- name: Ensure wireguard kernel module is loaded
  community.general.modprobe:
    name: wireguard
    state: present
